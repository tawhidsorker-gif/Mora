name: Build Mora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 for SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (API 30)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-30" "build-tools;30.0.3" "platform-tools"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Set up JDK 11 for Android 11 build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle 7.5 wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          curl -fsSL https://services.gradle.org/distributions/gradle-7.5-bin.zip -o /tmp/gradle-7.5.zip
          unzip -q /tmp/gradle-7.5.zip -d /tmp/
          /tmp/gradle-7.5/bin/gradle wrapper --gradle-version 7.5 --distribution-type all
          chmod +x ./gradlew

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mora-Android11-APK
          path: app/build/outputs/apk/debug/app-debug.apk
